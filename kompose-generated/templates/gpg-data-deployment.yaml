apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: ./kompose convert -f compose.yaml --chart -o kompose-generated
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: gpg-data
  name: gpg-data
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: gpg-data
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: ./kompose convert -f compose.yaml --chart -o kompose-generated
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: gpg-data
    spec:
      containers:
        - image: registry.community.greenbone.net/community/gpg-data
          name: gpg-data
          volumeMounts:
            - mountPath: /mnt
              name: gpg-data-vol
      restartPolicy: Always
      volumes:
        - name: gpg-data-vol
          persistentVolumeClaim:
            claimName: gpg-data-vol
