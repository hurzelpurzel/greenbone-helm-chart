apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: ./kompose convert -f compose.yaml --chart -o kompose-generated
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: notus-data
  name: notus-data
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: notus-data
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: ./kompose convert -f compose.yaml --chart -o kompose-generated
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: notus-data
    spec:
      containers:
        - env:
            - name: KEEP_ALIVE
              value: "1"
          image: registry.community.greenbone.net/community/notus-data
          name: notus-data
          volumeMounts:
            - mountPath: /mnt
              name: notus-data-vol
      restartPolicy: Always
      volumes:
        - name: notus-data-vol
          persistentVolumeClaim:
            claimName: notus-data-vol
