apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: ./kompose convert -f compose.yaml --chart -o kompose-generated
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: openvasd
  name: openvasd
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: openvasd
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: ./kompose convert -f compose.yaml --chart -o kompose-generated
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: openvasd
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - env:
            - name: GNUPGHOME
              value: /etc/openvas/gnupg
            - name: LISTENING
              value: 0.0.0.0:80
            - name: OPENVASD_MODE
              value: service_notus
          image: registry.community.greenbone.net/community/openvas-scanner:stable
          name: openvasd
          volumeMounts:
            - mountPath: /etc/openvas
              name: openvas-data-vol
            - mountPath: /var/log/openvas
              name: openvas-log-data-vol
            - mountPath: /etc/openvas/gnupg
              name: gpg-data-vol
            - mountPath: /var/lib/notus
              name: notus-data-vol
      restartPolicy: Always
      volumes:
        - name: openvas-data-vol
          persistentVolumeClaim:
            claimName: openvas-data-vol
        - name: openvas-log-data-vol
          persistentVolumeClaim:
            claimName: openvas-log-data-vol
        - name: gpg-data-vol
          persistentVolumeClaim:
            claimName: gpg-data-vol
        - name: notus-data-vol
          persistentVolumeClaim:
            claimName: notus-data-vol
