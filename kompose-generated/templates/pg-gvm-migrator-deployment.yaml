apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: ./kompose convert -f compose.yaml --chart -o kompose-generated
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: pg-gvm-migrator
  name: pg-gvm-migrator
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: pg-gvm-migrator
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: ./kompose convert -f compose.yaml --chart -o kompose-generated
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: pg-gvm-migrator
    spec:
      containers:
        - image: registry.community.greenbone.net/community/pg-gvm-migrator:stable
          name: pg-gvm-migrator
          volumeMounts:
            - mountPath: /var/lib/postgresql
              name: psql-data-vol
            - mountPath: /var/run/postgresql
              name: psql-socket-vol
      restartPolicy: Never
      volumes:
        - name: psql-data-vol
          persistentVolumeClaim:
            claimName: psql-data-vol
        - name: psql-socket-vol
          persistentVolumeClaim:
            claimName: psql-socket-vol
